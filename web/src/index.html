<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@700&family=Fira+Code:wght@300..700&family=Inter:wght@400..700&display=swap"
    />
    <title>agents-party</title>
    <script>
      // Apply the saved theme before first paint so there's no flash. Mirrors web/src/lib/theme.ts.
      try {
        var t = localStorage.getItem('ap-theme')
        if (t === 'dark' || t === 'light') document.documentElement.classList.add(t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.client.tsx"></script>
  </body>
</html>
